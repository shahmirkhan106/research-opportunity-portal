<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Research Opportunity Portal</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="#">Research Opportunity Portal</a>
      <div class="d-flex">
        <button
          class="btn btn-light"
          id="btn-add-opportunity"
          data-bs-toggle="modal"
          data-bs-target="#opportunity-modal"
        >
          + Add Opportunity
        </button>
      </div>
    </div>
  </nav>

  <main class="container pb-5">
    <div id="alert-area"></div>

    <section id="list-section">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h4 mb-0">Research Opportunities</h2>
        <span class="text-muted" id="record-count"></span>
      </div>

      <div id="empty-state" class="text-center text-muted py-5 d-none">
        <p class="h5">No research opportunities yet.</p>
        <p>Click "Add Opportunity" to post the first one.</p>
      </div>

      <div class="table-responsive" id="list-wrapper">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>Title</th>
              <th>Research Area</th>
              <th>Faculty</th>
              <th>Department</th>
              <th class="text-center">Positions</th>
              <th>Deadline</th>
              <th class="text-center">Status</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="opportunity-list"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Details modal -->
  <div class="modal fade" id="details-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="details-title">Opportunity details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="details-body"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Create / edit form modal -->
  <div class="modal fade" id="opportunity-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="opportunity-form" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="form-modal-title">Add Opportunity</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-12">
                <label for="field-title" class="form-label">Title</label>
                <input type="text" class="form-control" id="field-title" name="title" maxlength="255" />
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-12">
                <label for="field-description" class="form-label">Description</label>
                <textarea class="form-control" id="field-description" name="description" rows="3"></textarea>
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-6">
                <label for="field-research_area" class="form-label">Research Area</label>
                <input type="text" class="form-control" id="field-research_area" name="research_area" maxlength="150" />
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-6">
                <label for="field-faculty_name" class="form-label">Faculty Name</label>
                <input type="text" class="form-control" id="field-faculty_name" name="faculty_name" maxlength="150" />
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-6">
                <label for="field-department" class="form-label">Department</label>
                <input type="text" class="form-control" id="field-department" name="department" maxlength="150" />
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-6">
                <label for="field-required_skills" class="form-label">Required Skills</label>
                <input
                  type="text"
                  class="form-control"
                  id="field-required_skills"
                  name="required_skills"
                  maxlength="500"
                  placeholder="comma-separated, e.g. Python, Git, SQL"
                />
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-4">
                <label for="field-positions_available" class="form-label">Positions Available</label>
                <input type="number" class="form-control" id="field-positions_available" name="positions_available" min="1" step="1" />
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-4">
                <label for="field-application_deadline" class="form-label">Application Deadline</label>
                <input type="date" class="form-control" id="field-application_deadline" name="application_deadline" />
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-4">
                <label for="field-status" class="form-label">Status</label>
                <select class="form-select" id="field-status" name="status">
                  <option value="Open">Open</option>
                  <option value="Closed">Closed</option>
                </select>
                <div class="invalid-feedback"></div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="btn-submit-opportunity">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Delete confirmation modal -->
  <div class="modal fade" id="delete-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Confirm deletion</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="mb-1">Delete this opportunity?</p>
          <p class="fw-semibold text-danger mb-0" id="delete-target-title"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="btn-confirm-delete">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
</body>
</html>
